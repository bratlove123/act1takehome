name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXTERNAL_API_KEY: ${{ secrets.EXTERNAL_API_KEY }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Migrate and seed production database
        run: npm run db:setup
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSL: "true"

      - name: Install Vercel CLI
        run: npm install -g vercel@39

      - name: Deploy to Vercel (production)
        run: VERCEL_ORG_ID="${{ secrets.VERCEL_ORG_ID }}" VERCEL_PROJECT_ID="${{ secrets.VERCEL_PROJECT_ID }}"  vercel deploy --prod --yes --token="$VERCEL_TOKEN"

