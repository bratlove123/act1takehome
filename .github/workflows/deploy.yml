name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXTERNAL_API_KEY: ${{ secrets.EXTERNAL_API_KEY }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Migrate and seed production database
        run: npm run db:setup
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSL: "true"

      - name: Print Vercel secret suffixes (last 4 chars)
        run: |
          mask_last4() {
            local name="$1"
            local val="$2"
            if [ -z "$val" ]; then
              echo "$name: (empty — secret not set)"
            else
              echo "$name: ****${val: -4} (length ${#val})"
            fi
          }
          echo "Vercel secret fingerprint (last 4 characters only):"
          mask_last4 "VERCEL_TOKEN" "$VERCEL_TOKEN"
          mask_last4 "VERCEL_ORG_ID" "$VERCEL_ORG_ID"
          mask_last4 "VERCEL_PROJECT_ID" "$VERCEL_PROJECT_ID"

      - name: Install Vercel CLI
        run: npm install -g vercel@39

      # CI has no local `vercel link`; write project.json from secrets.
      # Do NOT commit `.vercel/` — it is gitignored.
      - name: Link Vercel project for CI
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      # Remote build on Vercel (avoids `vercel pull`, which fails with some project-scoped tokens).
      - name: Deploy to Vercel (production)
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN" --debug
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
