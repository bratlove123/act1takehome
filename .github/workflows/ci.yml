name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: act1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d act1"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/act1
      EXTERNAL_API_KEY: ${{ secrets.EXTERNAL_API_KEY }}
      PGSSL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Provide EXTERNAL_API_KEY fallback for forks
        if: env.EXTERNAL_API_KEY == ''
        run: echo "EXTERNAL_API_KEY=ci-test-external-api-key" >> "$GITHUB_ENV"

      - name: Migrate and seed database
        run: npm run db:setup
        working-directory: backend

      - name: Lint backend
        run: npm run lint
        working-directory: backend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Test backend
        run: npm test
        working-directory: backend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Docker build backend image
        run: docker build -t act1-backend ./backend
